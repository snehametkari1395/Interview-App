# Interview App theme: deep green brand on a soft off-white surface, white sidebar.
[theme]
base = "light"
primaryColor = "#1F5130"
backgroundColor = "#F7F8F3"
secondaryBackgroundColor = "#EDF1E6"
textColor = "#17251B"
linkColor = "#1F5130"
greenColor = "#2F6B3A"
borderColor = "#DCE3D3"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "monospace"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
metricValueFontWeight = 700
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3E6"
textColor = "#17251B"
borderColor = "#E3E8DB"

[client]
showSidebarNavigation = true
